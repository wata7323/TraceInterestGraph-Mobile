<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2efe8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Trace — Interest Graph Demo</title>
  <meta name="description" content="雑なメモから、自分の興味のつながりを見つけるローカルデモ。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://trace-interest-sync.kazutanagai02.workers.dev; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="trace-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="trace-icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#capture" aria-label="Trace ホーム">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>TRACE</span>
    </a>
    <div class="sync-state" id="syncState" title="この端末への保存状態">
      <span class="status-dot"></span><span>端末に保存</span>
    </div>
  </header>

  <main>
    <section class="view active" id="capture" aria-labelledby="captureTitle">
      <div class="section-heading">
        <p class="eyebrow">CAPTURE</p>
        <h1 id="captureTitle">思ったことを、そのまま。</h1>
      </div>

      <form class="capture-form" id="memoForm">
        <label class="sr-only" for="memoText">メモ</label>
        <textarea id="memoText" maxlength="500" rows="3" placeholder="今、気になったこと" required></textarea>
        <div class="preview" id="photoPreview" hidden></div>
        <div class="form-row">
          <label class="quiet-button" for="photoInput">＋ 写真</label>
          <input id="photoInput" type="file" accept="image/*" hidden>
          <span class="location-choice">
            <input id="withLocation" type="checkbox">
            <label for="withLocation">位置を追加</label>
          </span>
          <span class="spacer"></span>
          <span class="char-count" id="charCount">0 / 500</span>
          <button class="primary-button capture-submit" type="submit">保存</button>
        </div>
        <p class="form-message" id="formMessage" role="status"></p>
      </form>
    </section>

    <section class="view" id="discover" aria-labelledby="discoverTitle">
      <div class="section-heading compact">
        <p class="eyebrow">DISCOVER</p>
        <h1 id="discoverTitle">過去の自分から、発見する。</h1>
      </div>
      <div class="discover-grid" id="discoverGrid"></div>
    </section>

    <section class="view" id="map" aria-labelledby="mapTitle">
      <div class="section-heading compact map-heading">
        <div>
          <p class="eyebrow">INTEREST MAP</p>
          <h1 id="mapTitle">興味の輪郭。</h1>
        </div>
        <div class="legend" aria-label="線の凡例">
          <span>大きさ＝接続数</span>
          <span><i class="memo-mark"></i>メモ</span>
          <span><i class="tag-mark"></i>タグ</span>
          <span><i class="solid-line"></i>意味</span>
          <span><i class="dashed-line"></i>仮説</span>
        </div>
      </div>
      <div class="map-shell">
        <div class="map-toolbar">
          <div><span class="layout-state idle" id="layoutState">意味配置：準備中</span><span>ドラッグで回転</span></div>
          <button type="button" id="resetGraph">視点を戻す</button>
        </div>
        <canvas id="graph" tabindex="0" role="application" aria-label="ドラッグで回転できる3D興味マップ"></canvas>
        <div class="map-detail" id="mapDetail">近いほど、意味が似ています。</div>
      </div>
    </section>

    <section class="view" id="archive" aria-labelledby="archiveTitle">
      <div class="section-heading compact archive-heading">
        <div>
          <p class="eyebrow">ARCHIVE</p>
          <h1 id="archiveTitle">残したもの。</h1>
        </div>
        <label class="search-box">
          <span class="sr-only">メモを検索</span>
          <input id="searchInput" type="search" placeholder="メモ・キーワードを検索">
        </label>
      </div>
      <section class="cloud-sync-panel" aria-labelledby="cloudSyncTitle">
        <div>
          <p class="eyebrow">ONE-TAP SYNC</p>
          <h2 id="cloudSyncTitle">ボタンひとつでPCへ送る</h2>
          <p>暗号化して同期。PCのAIタグと3Dマップもスマホへ戻ります。</p>
        </div>
        <div class="cloud-setup" id="cloudSetup">
          <button class="primary-button" type="button" id="createCloudSync">このスマホを設定</button>
          <div class="cloud-join">
            <label for="cloudSyncCode">PCへ接続コードを入力</label>
            <input id="cloudSyncCode" type="text" inputmode="text" autocomplete="off" maxlength="23" placeholder="XXXXX-XXXXX-XXXXX-XXXXX">
            <button class="quiet-button" type="button" id="joinCloudSync">PCを接続</button>
          </div>
        </div>
        <div class="cloud-ready" id="cloudReady" hidden>
          <span id="cloudRole"></span>
          <button class="primary-button" type="button" id="cloudSyncNow">同期する</button>
          <button class="quiet-button" type="button" id="showCloudCode">接続コードを表示</button>
          <button class="text-button" type="button" id="resetCloudSync">設定をやり直す</button>
        </div>
        <output class="cloud-code" id="cloudCodeDisplay" hidden></output>
        <p class="transfer-message" id="cloudSyncMessage" role="status"></p>
      </section>
      <section class="transfer-panel" aria-labelledby="transferTitle">
        <div>
          <p class="eyebrow">SAFE TRANSFER</p>
          <h2 id="transferTitle">スマホとPCのメモを統合</h2>
          <p>既存メモを消さずに統合します。</p>
        </div>
        <div class="transfer-actions">
          <button class="quiet-button" type="button" id="exportMemos">移行ファイルを書き出す</button>
          <label class="primary-button import-button" for="importMemos">移行ファイルを取り込む</label>
          <input id="importMemos" type="file" accept="application/json,.json" hidden>
        </div>
        <p class="transfer-message" id="transferMessage" role="status"></p>
      </section>
      <div class="memo-list" id="memoList"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <a href="#capture" data-view="capture" class="active"><span>＋</span>残す</a>
    <a href="#discover" data-view="discover"><span>✦</span>発見</a>
    <a href="#map" data-view="map"><span>⌘</span>地図</a>
    <a href="#archive" data-view="archive"><span>≡</span>記録</a>
  </nav>

  <dialog id="editDialog">
    <form method="dialog" id="editForm">
      <div class="dialog-head">
        <div><p class="eyebrow">EDIT</p><h2>メモを整える</h2></div>
        <button class="icon-button" value="cancel" aria-label="閉じる">×</button>
      </div>
      <label for="editText">メモ</label>
      <textarea id="editText" rows="5" maxlength="500" required></textarea>
      <label for="editKeywords">キーワード <small>読点で区切る</small></label>
      <input id="editKeywords" type="text">
      <div class="dialog-actions">
        <button class="quiet-button" value="cancel">キャンセル</button>
        <button class="primary-button" id="saveEdit" value="default">保存</button>
      </div>
    </form>
  </dialog>

  <template id="emptyTemplate">
    <div class="empty-state"><p>まだ十分なメモがありません。</p><span>いくつか残すと、ここに関係が現れます。</span></div>
  </template>

  <script src="transfer-core.js" defer></script>
  <script src="app.js" defer></script>
  <script src="cloud-config.js" defer></script>
  <script src="cloud-sync.js" defer></script>
</body>
</html>
